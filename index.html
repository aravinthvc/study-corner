      const has = state.mockChapters.includes(id);
      if(has && state.mockChapters.length===1) return;
      state.mockChapters = has ? state.mockChapters.filter(x=>x!==id) : [...state.mockChapters, id];
      chip.classList.toggle('on');
    });
  });
  document.getElementById('selAll').addEventListener('click', ()=>{
    state.mockChapters = chapters.map(c=>c.id);
    content.querySelectorAll('.chip').forEach(c=>c.classList.add('on'));
  });
  document.getElementById('selNone').addEventListener('click', ()=>{
    state.mockChapters = [chapters[0].id];
    content.querySelectorAll('.chip').forEach((c,i)=>c.classList.toggle('on', i===0));
  });
  content.querySelectorAll('.radio-opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      state.mockLevel = opt.dataset.lvl;
      content.querySelectorAll('.radio-opt').forEach(o=>o.classList.remove('on'));
      opt.classList.add('on');
    });
  });
  document.getElementById('genBtn').addEventListener('click', isHindi ? generateHindiPaper : generatePaper);
  wireReferenceSection('general');
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function generatePaper(){
  const multByLevel = { class: 1, term: 2, fullterm: 5 };
  const mult = multByLevel[state.mockLevel] || 1;
  const selected = chapters.filter(c=>state.mockChapters.includes(c.id));
  const pool = selected.flatMap(c=>c.practice.map(q=>({...q, chapter:c.title})));

  // Calibrated to match a real DAV Periodic Test paper: Part A is objective
  // questions worth half a mark each, then Parts B/C/D step up through 2, 3
  // and 4-mark questions. At mult=2 this gives 8+4+4+4=20 questions for
  // 40 marks (the confirmed real Periodic Test); mult=1 halves that for a
  // shorter Quick Practice; mult=5 scales it up to the 100-mark Full Term
  // Exam (20+10+10+10=50 questions) — same shape, bigger paper.
  const byMarks = m => shuffle(pool.filter(q=>q.marks===m));
  const wantA = 4*mult, wantB = 2*mult, wantC = 2*mult, wantD = 2*mult;
  const secA = byMarks(1).slice(0, wantA);
  const secB = byMarks(2).slice(0, wantB);
  const secC = byMarks(3).slice(0, wantC);
  const secD = byMarks(4).slice(0, wantD);

  const total = secA.length*0.5 + secB.length*2 + secC.length*3 + secD.length*4;
  const time = state.mockLevel==='fullterm' ? '2 hours 30 minutes' : state.mockLevel==='term' ? '1 hour 30 minutes' : '45 minutes';
  const chNames = selected.map(c=>c.title.replace(/^\d+\.\s/,'')).join(', ');

  lastGeneratedPaper = {
    chapterIds: selected.map(c=>c.id),
    chapterNames: chNames,
    maxMarks: total,
    level: state.mockLevel
  };

  let warn = '';
  const gotQuestions = secA.length + secB.length + secC.length + secD.length;
  const wantQuestions = wantA + wantB + wantC + wantD;
  if(gotQuestions < wantQuestions){
    warn = `<div class="paper-warn">Only ${gotQuestions} of ${wantQuestions} questions could be filled from the selected chapters (max marks came to ${total} instead of the full total) — some questions may repeat next time you regenerate. Select more chapters, or use a shorter paper length, for a completely fresh full-length paper.</div>`;
  }

  let qNum = 0;
  const renderSection = (title, qs, marksEach) => {
    if(!qs.length) return '';
    const marksLabel = marksEach === 0.5 ? '\u00BD' : marksEach;
    return `<div class="paper-section-title">${title}</div>` + qs.map(q=>{
      qNum++;
      if(q.type==='ar'){
        const opts = `<div class="opts">${AR_OPTIONS.map((o,i)=>`(${String.fromCharCode(97+i)}) ${o}`).join('<br>')}</div>`;
        return `<div class="paper-q"><span class="pm">[${marksLabel}]</span>Q${qNum}. Assertion (A): ${q.assertion}<br>Reason (R): ${q.reason}${opts}</div>`;
      }
      let opts = '';
      if(q.type==='mcq'){
        opts = `<div class="opts">${q.options.map((o,i)=>`(${String.fromCharCode(97+i)}) ${o}`).join('&nbsp;&nbsp;&nbsp;')}</div>`;
      }
      return `<div class="paper-q"><span class="pm">[${marksLabel}]</span>Q${qNum}. ${q.q}${opts}</div>`;
    }).join('');
  };

  let qCounter = 0;
  const keyItems = [...secA, ...secB, ...secC, ...secD].map(q=>{
    qCounter++;
    const ans = q.type==='mcq' ? q.options[q.answer] : q.type==='ar' ? AR_OPTIONS[q.answer] : (Array.isArray(q.answer) ? q.answer[0] : q.answer);
    return `<li><b>Q${qCounter}.</b> ${ans} — <i>${q.explain}</i></li>`;
  }).join('');

  const paperHTML = `
    <div class="paper" id="paperContent">
      <div class="paper-head">
        <h2>DAV Public School, Adambakkam</h2>
        <div class="sub">${state.mockLevel==='fullterm' ? 'Term Exam' : state.mockLevel==='term' ? 'Periodic Test' : 'Class Test'} &middot; Mathematics &middot; Class V</div>
      </div>
      <div class="paper-info"><span>Time: ${time}</span><span>Max. Marks: ${total}</span></div>
      <div class="paper-instr">
        General Instructions: (i) All questions are compulsory. (ii) Part A has MCQs and Assertion-Reason questions of &frac12; mark each. (iii) Part B has questions of 2 marks each. (iv) Part C has questions of 3 marks each. (v) Part D has HOTS/case-based questions of 4 marks each. (vi) Show your working wherever needed.
        <br><br><b>Chapters covered:</b> ${chNames}
      </div>
      ${renderSection('Part A — Multiple Choice Questions', secA, 0.5)}
      ${renderSection('Part B — Very Short Answer', secB, 2)}
      ${renderSection('Part C — Short Answer', secC, 3)}
      ${renderSection('Part D — Long Answer / HOTS', secD, 4)}
      <details class="answer-key">
        <summary>Show Answer Key &amp; Explanations (for parents/checking)</summary>
        <ul>${keyItems}</ul>
      </details>
    </div>
  `;

  document.getElementById('paperHolder').innerHTML = `
    ${warn}
    <div class="paper-actions">
      <button class="btn" id="printBtn">Print / Save as PDF</button>
      <button class="btn secondary" id="regenBtn">Generate a Different Paper</button>
      <button class="btn secondary" id="logResultBtn">Log Result After Grading</button>
    </div>
    <div id="logResultHolder"></div>
    ${paperHTML}
  `;
  document.getElementById('printBtn').addEventListener('click', ()=>window.print());
  document.getElementById('regenBtn').addEventListener('click', generatePaper);
  document.getElementById('logResultBtn').addEventListener('click', renderLogResultForm);
  document.getElementById('paperHolder').scrollIntoView({behavior:'smooth'});
}

/* Normalizes one hindiSkillPool item into a common {prompt, answer, options}
   shape so the paper renderer and answer key don't need per-category branches. */
function normalizeHindiItem(cat, it){
  switch(cat){
    case 'opposites': return { prompt: `${it.word} का विलोम (opposite) है —`, answer: it.answer, options: it.options };
    case 'synonyms': return { prompt: `${it.word} का पर्यायवाची (synonym) है —`, answer: it.answer, options: it.options };
    case 'meanings': return { prompt: `${it.word} का अर्थ है —`, answer: it.answer, options: it.options };
    case 'gender': return { prompt: `${it.word} का लिंग बदलिए (change the gender) —`, answer: it.answer, options: it.options };
    case 'rhyming': return { prompt: `${it.word} से तुकांत (rhyming) शब्द है —`, answer: it.answer, options: it.options };
    case 'adjectives': return { prompt: `उचित विशेषण चुनिए — ___ ${it.noun}`, answer: it.answer, options: it.options };
    case 'suffix': return { prompt: `${it.base} + ${it.suffix} = ____________`, answer: it.answer, options: null };
    case 'prefix': return { prompt: `${it.prefix} + ${it.base} = ____________`, answer: it.answer, options: null };
    case 'meinmain': return { prompt: it.sentence, answer: it.answer, options: null };
    case 'wordorder': return { prompt: `शब्दों को सही क्रम में लगाइए — ${it.jumbled.join(' / ')}`, answer: it.answer, options: null };
    default: return { prompt: '', answer: '', options: null };
  }
}

const HINDI_SKILL_LABELS = {
  opposites: "विपरीतार्थक शब्द (Opposites)",
  synonyms: "पर्यायवाची शब्द (Synonyms)",
  meanings: "शब्द-अर्थ (Word Meanings)",
  gender: "लिंग बदलिए (Gender Change)",
  adjectives: "उचित विशेषण चुनिए (Adjectives)",
  suffix: "प्रत्यय लगाकर शब्द बनाइए (Suffix)",
  prefix: "उपसर्ग लगाकर शब्द बनाइए (Prefix)",
  meinmain: "में, मैं भरकर वाक्य पूरा कीजिए",
  rhyming: "तुकांत शब्द (Rhyming Words)",
  wordorder: "शब्दों को सही क्रम में लगाइए (Word Order)"
};

function generateHindiPaper(){
  // Hindi's real Periodic Test is structured by grammar-skill category, not
  // by a Part A–D mark-tier the way Maths is — confirmed against Kayalini's
  // actual PT1 and PT2 papers (both 40 marks / 1.5 hrs, both totalling
  // exactly 40 across: reading comprehension 5, several grammar sub-parts,
  // MCQ-from-lesson 4, one-sentence answers 4, brief answers 4).
  const isFullPT = state.mockLevel === 'term';
  const selected = chapters.filter(c=>state.mockChapters.includes(c.id));
  const chNames = selected.map(c=>c.title.replace(/^\d+\.\s/,'')).join(', ');

  // Section I — reading comprehension. Never reproduces the copyrighted
  // poem/story text itself, only tests understanding of it — same as how
  // the real PT pairs a short passage with questions, except we ask
  // directly about the lesson rather than transcribing the passage.
  const compPool = selected.flatMap(c => c.practice.filter(q=>q.type==='short' && q.marks>=2).map(q=>({...q, chapter:c.title})));
  const wantComp = isFullPT ? 5 : 2;
  const secComp = shuffle(compPool).slice(0, wantComp);

  const grammarCats = isFullPT
    ? [['opposites',4], ['synonyms',3], ['meanings',3], ['gender',3], ['adjectives',3], ['suffix',3], ['prefix',2], ['meinmain',2]]
    : [['opposites',3], ['synonyms',2], ['gender',2], ['meanings',2], ['suffix',2]];
  const grammarSections = grammarCats.map(([cat,count])=>({
    cat, items: shuffle(hindiSkillPool[cat]).slice(0, count).map(it=>normalizeHindiItem(cat, it))
  })).filter(g=>g.items.length);

  const mcqPool = selected.flatMap(c => c.practice.filter(q=>q.type==='mcq').map(q=>({...q, chapter:c.title})));
  const wantMcq = isFullPT ? 4 : 2;
  const secMcq = shuffle(mcqPool).slice(0, wantMcq);

  const shortPool = selected.flatMap(c => c.practice.filter(q=>q.type==='short').map(q=>({...q, chapter:c.title})));
  const usedQ1 = new Set(secComp.map(q=>q.q));
  const wantOneSent = isFullPT ? 4 : 2;
  const secOneSent = shuffle(shortPool.filter(q=>!usedQ1.has(q.q))).slice(0, wantOneSent);

  const usedQ2 = new Set([...secComp, ...secOneSent].map(q=>q.q));
  const wantBrief = isFullPT ? 2 : 1;
  const secBrief = shuffle(shortPool.filter(q=>!usedQ2.has(q.q) && q.marks>=2)).slice(0, wantBrief);

  const grammarMarks = grammarSections.reduce((s,g)=>s+g.items.length,0);
  const total = secComp.length*1 + grammarMarks*1 + secMcq.length*1 + secOneSent.length*1 + secBrief.length*2;
  const time = isFullPT ? '1 hour 30 minutes' : '45 minutes';

  lastGeneratedPaper = {
    chapterIds: selected.map(c=>c.id),
    chapterNames: chNames,
    maxMarks: total,
    level: state.mockLevel
  };

  const wantGrammar = grammarCats.reduce((s,[,c])=>s+c,0);
  const wantTotal = wantComp + wantGrammar + wantMcq + wantOneSent + wantBrief;
  const gotTotal = secComp.length + grammarMarks + secMcq.length + secOneSent.length + secBrief.length;
  let warn = '';
  if(gotTotal < wantTotal){
    warn = `<div class="paper-warn">Only ${gotTotal} of ${wantTotal} questions could be filled from the selected chapters (max marks came to ${total}) — select more chapters for a fuller paper.</div>`;
  }

  let qNum = 0;
  const optRow = opts => opts ? `<div class="opts">${opts.map((o,i)=>`(${String.fromCharCode(97+i)}) ${o}`).join('&nbsp;&nbsp;&nbsp;')}</div>` : '';

  const compHTML = secComp.length ? `<div class="paper-section-title">I. गद्यांश-आधारित प्रश्न (Based on your lesson reading) <span class="pm">[${secComp.length}]</span></div>` +
    secComp.map(q=>{ qNum++; return `<div class="paper-q">${qNum}. ${q.q}</div>`; }).join('') : '';

  const grammarHTML = grammarSections.length ? `<div class="paper-section-title">II. व्याकरण (Grammar)</div>` +
    grammarSections.map((g,gi)=>{
      const letter = "अआइईउऊऋए"[gi] || String.fromCharCode(2309+gi);
      return `<div class="paper-subsection">${letter}. ${HINDI_SKILL_LABELS[g.cat]} <span class="pm">[${g.items.length}]</span></div>` +
        g.items.map((it,i)=>{ qNum++; return `<div class="paper-q">${i+1}. ${it.prompt}${optRow(it.options)}</div>`; }).join('');
    }).join('') : '';

  const mcqHTML = secMcq.length ? `<div class="paper-section-title">III. सही विकल्प चुनिए (Choose the correct option) <span class="pm">[${secMcq.length}]</span></div>` +
    secMcq.map(q=>{ qNum++; return `<div class="paper-q">${qNum}. ${q.q}${optRow(q.options)}</div>`; }).join('') : '';

  const oneSentHTML = secOneSent.length ? `<div class="paper-section-title">IV. एक वाक्य में उत्तर दीजिए (Answer in one sentence) <span class="pm">[${secOneSent.length}]</span></div>` +
    secOneSent.map(q=>{ qNum++; return `<div class="paper-q">${qNum}. ${q.q}</div>`; }).join('') : '';

  const briefHTML = secBrief.length ? `<div class="paper-section-title">V. संक्षेप में उत्तर दीजिए (Answer in brief) <span class="pm">[${secBrief.length}\u00D72]</span></div>` +
    secBrief.map(q=>{ qNum++; return `<div class="paper-q">${qNum}. ${q.q}</div>`; }).join('') : '';

  const keyItems = [];
  secComp.forEach(q=>keyItems.push(`<li>${q.q} — ${Array.isArray(q.answer)?q.answer[0]:q.answer}</li>`));
  grammarSections.forEach(g=>g.items.forEach(it=>keyItems.push(`<li>${it.prompt.replace('____________','').trim()} — <b>${it.answer}</b></li>`)));
  secMcq.forEach(q=>keyItems.push(`<li>${q.q} — <b>${q.options[q.answer]}</b> <i>(${q.explain})</i></li>`));
  secOneSent.forEach(q=>keyItems.push(`<li>${q.q} — ${Array.isArray(q.answer)?q.answer[0]:q.answer}</li>`));
  secBrief.forEach(q=>keyItems.push(`<li>${q.q} — ${Array.isArray(q.answer)?q.answer[0]:q.answer}</li>`));

  const paperHTML = `
    <div class="paper" id="paperContent">
      <div class="paper-head">
        <h2>D.A.V. School, Adambakkam</h2>
        <div class="sub">${isFullPT ? 'Periodic Test' : 'Quick Practice'} &middot; II Language \u2014 Hindi &middot; Class V</div>
      </div>
      <div class="paper-info"><span>Time: ${time}</span><span>Max. Marks: ${total}</span></div>
      <div class="paper-instr">
        General Instructions: सभी प्रश्न अनिवार्य हैं। (All questions are compulsory.)
        <br><br><b>Chapters covered:</b> ${chNames}
      </div>
      ${compHTML}
      ${grammarHTML}
      ${mcqHTML}
      ${oneSentHTML}
      ${briefHTML}
      <details class="answer-key">
        <summary>Show Answer Key &amp; Explanations (for parents/checking)</summary>
        <ul>${keyItems.join('')}</ul>
      </details>
    </div>
  `;

  document.getElementById('paperHolder').innerHTML = `
    ${warn}
    <div class="paper-actions">
      <button class="btn" id="printBtn">Print / Save as PDF</button>
      <button class="btn secondary" id="regenBtn">Generate a Different Paper</button>
      <button class="btn secondary" id="logResultBtn">Log Result After Grading</button>
    </div>
    <div id="logResultHolder"></div>
    ${paperHTML}
  `;
  document.getElementById('printBtn').addEventListener('click', ()=>window.print());
  document.getElementById('regenBtn').addEventListener('click', generateHindiPaper);
  document.getElementById('logResultBtn').addEventListener('click', renderLogResultForm);
  document.getElementById('paperHolder').scrollIntoView({behavior:'smooth'});
}

function renderLogResultForm(){
  const holder = document.getElementById('logResultHolder');
  if(!holder || !lastGeneratedPaper) return;
  const today = new Date().toISOString().slice(0,10);
  holder.innerHTML = `
    <div class="log-form">
      <h4>Log this test's result</h4>
      <div class="log-row">
        <label>Date taken<input type="date" id="logDate" value="${today}"></label>
        <label>Marks scored<input type="number" id="logScored" min="0" max="${lastGeneratedPaper.maxMarks}" placeholder="out of ${lastGeneratedPaper.maxMarks}"></label>
      </div>
      <label class="log-notes-label">Notes (optional) — e.g. topics she struggled with
        <textarea id="logNotes" rows="2" placeholder="e.g. mixed up HCF and LCM steps"></textarea>
      </label>
      <button class="btn" id="logSaveBtn">Save Result</button>
      <span class="log-saved-msg" id="logSavedMsg"></span>
    </div>
  `;
  document.getElementById('logSaveBtn').addEventListener('click', ()=>{
    const scored = parseFloat(document.getElementById('logScored').value);
    if(isNaN(scored)){ alert('Please enter the marks scored.'); return; }
    saveTestRecord({
      date: document.getElementById('logDate').value || today,
      level: lastGeneratedPaper.level,
      chapterIds: lastGeneratedPaper.chapterIds,
      chapterNames: lastGeneratedPaper.chapterNames,
      maxMarks: lastGeneratedPaper.maxMarks,
      scoredMarks: scored,
      notes: document.getElementById('logNotes').value.trim()
    });
    document.getElementById('logSavedMsg').textContent = '\u2713 Saved to Test Records';
    document.getElementById('logScored').disabled = true;
    document.getElementById('logNotes').disabled = true;
    document.getElementById('logSaveBtn').disabled = true;
  });
}

/* ===================== INIT ===================== */
render();
</script>
