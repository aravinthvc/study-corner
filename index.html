<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kayalini's Study Corner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF6EC;
    --rule:#D9E3F0;
    --margin:#B33F3F;
    --ink:#202B3D;
    --ink-soft:#4A5568;
    --indigo:#2B4C7E;
    --marigold:#E8A93A;
    --marigold-dark:#C4841A;
    --peacock:#1F7A6C;
    --peacock-dark:#155A50;
    --success:#3E8E5A;
    --success-bg:#E7F3EA;
    --error:#B33F3F;
    --error-bg:#FBEAE7;
    --card:#FFFFFF;
    --line:#E4DCC8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Work Sans',sans-serif;
    color:var(--ink);
    background:var(--peacock-dark);
    -webkit-font-smoothing:antialiased;
  }
  .app{display:flex; min-height:100vh;}

  .sidebar{
    width:260px; flex-shrink:0;
    background:var(--peacock-dark); color:#EAF3F0;
    padding:28px 18px 18px; display:flex; flex-direction:column;
  }
  .brand{font-family:'Fraunces',serif; font-size:22px; font-weight:600; line-height:1.25; margin:0 0 2px;}
  .brand-sub{font-size:12.5px; color:#B9D8D1; margin:0 0 22px; line-height:1.4;}
  .curriculum-picker{display:flex; gap:6px; margin-bottom:18px;}
  .curriculum-picker select{flex:1; min-width:0; font-size:11.5px; padding:6px 6px; border-radius:6px; border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.08); color:#EAF3F0; font-family:inherit;}
  .curriculum-picker select option{color:#1a1a1a;}
  .nav-group-label{font-size:12px; letter-spacing:.02em; color:#8FC0B6; margin:18px 4px 8px;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px;
    cursor:pointer; font-size:13.5px; color:#DCEFEA; margin-bottom:2px; border:1px solid transparent;
  }
  .nav-item:hover{background:rgba(255,255,255,.08);}
  .nav-item.active{background:var(--marigold); color:#2B1E00; font-weight:600;}
  .nav-item .num{
    width:19px; height:19px; border-radius:50%; background:rgba(255,255,255,.15); color:#EAF3F0;
    font-size:10.5px; display:flex;align-items:center;justify-content:center; flex-shrink:0;
  }
  .nav-item.active .num{background:rgba(0,0,0,.18); color:#2B1E00;}
  .nav-item.special{border:1px dashed rgba(255,255,255,.35); margin-top:8px;}
  .subject-row{display:flex; align-items:center; justify-content:space-between; padding:9px 10px; border-radius:8px; cursor:pointer; margin-bottom:2px;}
  .subject-row.current{background:rgba(255,255,255,.12); font-weight:600;}
  .subject-row .soon{font-size:10px; background:rgba(255,255,255,.15); color:#CDE3DE; padding:2px 6px; border-radius:20px;}
  .subject-row.disabled{opacity:.55; cursor:default;}
  .sidebar-footer{margin-top:auto; font-size:11px; color:#8FC0B6; line-height:1.5; padding-top:14px; border-top:1px solid rgba(255,255,255,.12);}

  .main{
    flex:1; background:var(--paper);
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 31px, var(--rule) 32px);
    background-position: 0 96px;
    position:relative; min-width:0;
  }
  .main::before{content:""; position:absolute; top:0; bottom:0; left:78px; width:1px; background:var(--margin); opacity:.55;}
  .topbar{padding:26px 40px 18px 100px; background:var(--paper); position:relative; z-index:2;}
  .greeting{font-family:'Fraunces',serif; font-style:italic; font-weight:500; color:var(--peacock); font-size:15px; margin:0 0 4px;}
  .page-title{font-family:'Fraunces',serif; font-weight:700; font-size:30px; margin:0; color:var(--ink);}
  .page-sub{color:var(--ink-soft); font-size:14px; margin-top:6px; max-width:640px; line-height:1.5;}
  .content{padding:8px 40px 60px 100px; position:relative; z-index:2;}

  .tabbar{display:flex; gap:6px; margin:6px 0 22px; flex-wrap:wrap;}
  .tab{padding:8px 16px; border-radius:20px; background:#fff; border:1px solid var(--line); font-size:13.5px; cursor:pointer; color:var(--ink-soft); font-weight:500;}
  .tab.active{background:var(--indigo); border-color:var(--indigo); color:#fff;}
  .tab.tab-disabled{opacity:.5; cursor:default;}
  .tab.tab-disabled:hover{background:#fff;}

  .concept-card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:24px 26px; margin-bottom:26px;}
  .concept-card h3{font-family:'Fraunces',serif; font-size:19px; margin:0 0 14px; color:var(--indigo);}
  .concept-card ul{margin:0; padding-left:20px;}
  .concept-card li{margin-bottom:9px; line-height:1.55; font-size:14.5px;}
  .concept-card li b{color:var(--ink);}

  .q-card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px 24px; margin-bottom:16px;}
  .q-meta{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .q-tag{font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--peacock); background:#E4F2EF; padding:3px 9px; border-radius:20px; font-weight:600;}
  .q-tag.hots{color:var(--marigold-dark); background:#FCEFD8;}
  .q-marks{font-size:12.5px; color:var(--ink-soft);}
  .q-text{font-size:15.5px; line-height:1.55; margin-bottom:14px;}
  .options{display:flex; flex-direction:column; gap:8px;}
  .opt-btn{text-align:left; padding:10px 14px; border-radius:8px; border:1px solid var(--line); background:#FCFBF7; cursor:pointer; font-size:14.5px; font-family:inherit; color:var(--ink);}
  .opt-btn:hover{border-color:var(--indigo);}
  .opt-btn.correct{background:var(--success-bg); border-color:var(--success); color:var(--success); font-weight:600;}
  .opt-btn.wrong{background:var(--error-bg); border-color:var(--error); color:var(--error); font-weight:600;}
  .opt-btn[disabled]{cursor:default;}

  .answer-row{display:flex; gap:8px; margin-bottom:4px;}
  .answer-row input{flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--line); font-size:14.5px; font-family:inherit;}
  .btn{padding:9px 18px; border-radius:8px; border:none; background:var(--marigold); color:#2B1E00; font-weight:600; font-size:14px; cursor:pointer; font-family:inherit;}
  .btn:hover{background:var(--marigold-dark); color:#fff;}
  .btn.secondary{background:#fff; border:1px solid var(--indigo); color:var(--indigo);}
  .btn.secondary:hover{background:var(--indigo); color:#fff;}

  .feedback{margin-top:12px; padding:12px 14px; border-radius:8px; font-size:14px; line-height:1.5; display:none;}
  .feedback.show{display:block;}
  .feedback.ok{background:var(--success-bg); color:#245939;}
  .feedback.no{background:var(--error-bg); color:#7A2C22;}
  .feedback b{display:block; margin-bottom:3px; font-size:14.5px;}

  .score-bar{display:flex; align-items:center; gap:14px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px 20px; margin-bottom:20px;}
  .score-bar .track{flex:1; height:8px; background:#EFEAD9; border-radius:6px; overflow:hidden;}
  .score-bar .fill{height:100%; background:var(--peacock); width:0%;}
  .score-bar .num{font-weight:700; font-size:14.5px; color:var(--indigo); white-space:nowrap;}
  .score-bar .reset{font-size:12.5px; color:var(--ink-soft); cursor:pointer; text-decoration:underline; white-space:nowrap;}

  .setup-card{background:#fff; border:1px solid var(--line); border-radius:10px; padding:24px 26px; margin-bottom:22px;}
  .setup-card h3{font-family:'Fraunces',serif; margin:0 0 4px; font-size:19px; color:var(--indigo);}
  .setup-card p{color:var(--ink-soft); font-size:14px; margin:0 0 18px;}
  .chip-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
  .chip{padding:8px 14px; border-radius:20px; border:1.5px solid var(--line); font-size:13.5px; cursor:pointer; background:#fff; color:var(--ink-soft);}
  .chip.on{background:var(--peacock); border-color:var(--peacock); color:#fff; font-weight:600;}
  .chip-actions{margin-bottom:14px;}
  .chip-actions span{font-size:12.5px; color:var(--indigo); text-decoration:underline; cursor:pointer; margin-right:14px;}
  .radio-row{display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;}
  .radio-opt{border:1.5px solid var(--line); border-radius:10px; padding:12px 16px; cursor:pointer; font-size:13.5px; min-width:180px;}
  .radio-opt.on{border-color:var(--marigold); background:#FFF8EA;}
  .radio-opt b{display:block; font-size:14.5px; margin-bottom:2px; color:var(--ink);}

  .paper{background:#fff; border:1px solid var(--line); border-radius:10px; padding:34px 40px; max-width:760px;}
  .paper-head{text-align:center; border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:20px;}
  .paper-head h2{font-family:'Fraunces',serif; margin:0 0 4px; font-size:21px;}
  .paper-head .sub{font-size:13px; color:var(--ink-soft);}
  .paper-info{display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:6px; font-weight:600;}
  .paper-instr{font-size:12.5px; color:var(--ink-soft); background:#FAF6EC; border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin-bottom:22px; line-height:1.5;}
  .paper-section-title{font-weight:700; font-size:14.5px; margin:26px 0 12px; border-bottom:1px solid var(--line); padding-bottom:6px;}
  .paper-q{font-size:14.5px; margin-bottom:14px; line-height:1.55;}
  .paper-q .pm{float:right; color:var(--ink-soft); font-weight:600; font-size:13px;}
  .paper-q .opts{margin-top:5px; padding-left:14px; font-size:14px; color:var(--ink-soft);}
  .answer-key{margin-top:30px; border-top:2px dashed var(--line); padding-top:18px;}
  .answer-key summary{cursor:pointer; font-weight:700; color:var(--peacock); font-size:14.5px; margin-bottom:10px;}
  .answer-key li{margin-bottom:8px; font-size:13.5px; line-height:1.5;}
  .paper-actions{display:flex; gap:10px; margin:18px 0 24px;}
  .paper-warn{font-size:13px; color:var(--marigold-dark); background:#FFF8EA; border:1px solid #F0DBA5; border-radius:8px; padding:10px 14px; margin-bottom:16px;}

  .placeholder{background:#fff; border:1px dashed var(--line); border-radius:10px; padding:40px 30px; text-align:center; color:var(--ink-soft); font-size:14.5px; max-width:520px;}
  .placeholder b{color:var(--ink); display:block; font-family:'Fraunces',serif; font-size:18px; margin-bottom:8px;}
  .tab-soon{font-size:9.5px; text-transform:uppercase; color:var(--marigold-dark); background:#FCEFD8; padding:1px 6px; border-radius:10px; margin-left:4px; vertical-align:middle;}

  /* ---------- Watch & Learn ---------- */
  .lesson-picker{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; max-width:640px;}
  .lesson-chip{padding:7px 14px; border-radius:20px; background:#fff; border:1.5px solid var(--line); font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer;}
  .lesson-chip:hover{border-color:var(--peacock);}
  .lesson-chip.on{background:var(--peacock); border-color:var(--peacock); color:#fff;}
  .watch-lesson-title{font-family:'Fraunces',serif; font-weight:700; font-size:16px; color:var(--indigo); margin-bottom:12px;}
  .watch-card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:22px 22px 18px; max-width:640px;}
  .watch-stage{min-height:220px; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#FCFBF7; border:1px solid var(--line); border-radius:10px; padding:24px 16px; position:relative; overflow:hidden;}
  .watch-caption{margin-top:16px; font-size:15px; line-height:1.6; color:var(--ink); text-align:center; min-height:56px;}
  .watch-controls{display:flex; align-items:center; gap:9px; margin-top:16px; flex-wrap:wrap;}
  .watch-dots{display:flex; gap:6px; margin:0 6px;}
  .watch-dot{width:8px; height:8px; border-radius:50%; background:var(--line); cursor:pointer;}
  .watch-dot.on{background:var(--peacock);}
  .watch-icon-btn{width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--indigo);}
  .watch-icon-btn:hover{background:var(--indigo); color:#fff; border-color:var(--indigo);}
  .watch-icon-btn[disabled]{opacity:.35; cursor:default;}
  .watch-icon-btn[disabled]:hover{background:#fff; color:var(--indigo); border-color:var(--line);}
  .watch-icon-btn.primary{background:var(--marigold); border-color:var(--marigold); color:#2B1E00;}
  .watch-icon-btn.primary:hover{background:var(--marigold-dark); color:#fff;}
  .watch-narrate-toggle{font-size:12px; color:var(--ink-soft); cursor:pointer; text-decoration:underline; margin-left:auto;}
  .watch-voice-row{display:flex; align-items:center; gap:8px; margin-top:10px; padding-top:10px; border-top:1px solid var(--line);}
  .watch-voice-row label{font-size:11.5px; color:var(--ink-soft); font-weight:600;}
  .watch-voice-row select{flex:1; font-size:12.5px; padding:5px 8px; border-radius:6px; border:1px solid var(--line); font-family:inherit; max-width:280px;}
  .watch-eq{margin-top:14px; font-family:'Fraunces',serif; font-size:17px; font-weight:600; color:var(--indigo); text-align:center;}

  .pv-row{display:flex; gap:7px;}
  .pv-box{width:54px; height:64px; border:1.5px solid var(--line); border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; transition:transform .25s, background .25s, border-color .25s; background:#fff;}
  .pv-box.active{background:var(--marigold); border-color:var(--marigold-dark); transform:translateY(-6px) scale(1.08);}
  .pv-digit{font-family:'Fraunces',serif; font-size:21px; font-weight:700; color:var(--ink);}
  .pv-label{font-size:8.5px; color:var(--ink-soft); margin-top:2px; text-align:center; line-height:1.15;}
  .pv-box.active .pv-label{color:#2B1E00;}
  .pv-value-bubble{position:absolute; top:-28px; background:var(--indigo); color:#fff; font-size:11px; font-weight:600; padding:3px 8px; border-radius:20px; white-space:nowrap;}

  .col-op{display:flex; flex-direction:column; align-items:flex-end; font-family:'Fraunces',serif;}
  .col-op-row{display:flex;}
  .col-op-sign{width:24px; font-size:17px; font-weight:700; color:var(--peacock); text-align:center;}
  .col-cell{width:32px; height:32px; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:600;}
  .col-cell.hl{background:#FFF3D6; border-radius:6px;}
  .col-op-row.carries .col-cell{height:18px; font-size:12px; color:var(--marigold-dark); font-weight:700;}
  .col-op-line{width:100%; border-top:2px solid var(--ink); margin:2px 0;}
  .col-op-row.result .col-cell{color:var(--peacock); font-weight:700;}

  .groups-row{display:flex; gap:14px; flex-wrap:wrap; justify-content:center;}
  .group-box{border:1.5px dashed var(--line); border-radius:10px; padding:10px 12px; text-align:center; min-width:76px;}
  .group-box.selected-group{border:1.5px solid var(--marigold); background:#FFF8EA;}
  .group-label{font-size:10.5px; color:var(--ink-soft); margin-bottom:6px;}
  .dots{display:flex; gap:3px; flex-wrap:wrap; justify-content:center; max-width:66px;}
  .item-dot{opacity:.15; font-size:17px; transition:opacity .3s, transform .3s;}
  .item-dot.on{opacity:1; transform:scale(1.15);}

  .number-line-wrap{width:100%; padding:34px 14px 26px;}
  .number-line{position:relative; height:2px; background:var(--ink); width:100%; margin-top:18px;}
  .nl-tick{position:absolute; top:-3px; width:2px; height:8px; background:var(--ink-soft); transform:translateX(-50%);}
  .nl-tick span{position:absolute; top:12px; left:50%; transform:translateX(-50%); font-size:10px; color:var(--ink-soft);}
  .nl-dot{position:absolute; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; color:#fff; transform:translate(-50%, -50%); transition:all .3s;}
  .nl-a{top:-14px; background:var(--peacock);}
  .nl-b{top:14px; background:var(--marigold-dark);}
  .nl-highlight{position:absolute; top:50%; width:32px; height:32px; border-radius:50%; border:2.5px solid var(--error); transform:translate(-50%,-50%); animation:pulseRing 1.2s ease-in-out infinite;}
  @keyframes pulseRing{0%,100%{opacity:.5; transform:translate(-50%,-50%) scale(1);} 50%{opacity:1; transform:translate(-50%,-50%) scale(1.15);}}

  .frac-bar{display:flex; border:1.5px solid var(--ink); border-radius:6px; overflow:hidden; width:220px; height:44px;}
  .frac-cell{flex:1; border-right:1px solid var(--ink); background:#fff; transition:background .3s;}
  .frac-cell:last-child{border-right:none;}
  .frac-cell.on{background:var(--marigold);}
  .frac-row{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .frac-label{font-size:13px; color:var(--ink-soft); font-weight:600;}
  .frac-compare{display:flex; gap:24px; justify-content:center; flex-wrap:wrap;}
  .frac-row.winner .frac-bar{border-color:var(--success); box-shadow:0 0 0 3px var(--success-bg);}
  .frac-row.winner .frac-label{color:var(--success);}

  .decimal-grid{display:grid; grid-template-columns:repeat(10, 11px); grid-template-rows:repeat(10,11px); gap:1px; background:var(--line); padding:2px; border-radius:4px;}
  .decimal-cell{width:11px; height:11px; background:#fff;}
  .decimal-cell.on{background:var(--peacock);}
  .grid-compare-item{text-align:center;}
  .grid-compare-item .group-label{margin-bottom:8px; font-weight:600; font-size:12.5px; color:var(--ink);}

  .receipt{background:#fff; border:1.5px dashed var(--line); border-radius:8px; padding:14px 18px; min-width:260px;}
  .receipt-line{display:flex; justify-content:space-between; gap:20px; font-size:13.5px; padding:5px 0; border-bottom:1px dashed var(--line); opacity:0; transform:translateY(4px); animation:fadeInLine .35s forwards;}
  .receipt-line:last-child{border-bottom:none;}
  .receipt-line.total{font-weight:700; color:var(--indigo); border-top:1.5px solid var(--ink); border-bottom:none; margin-top:4px; padding-top:8px;}
  @keyframes fadeInLine{to{opacity:1; transform:translateY(0);}}

  .m-blocks-row{display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; justify-content:center;}
  .m-block{background:var(--peacock); color:#fff; font-size:11px; font-weight:700; border-radius:6px; padding:14px 10px; display:flex; align-items:center; justify-content:center; opacity:0; transform:scale(.7); animation:popIn .3s forwards;}
  .m-block.partial{background:var(--marigold); color:#2B1E00;}
  @keyframes popIn{to{opacity:1; transform:scale(1);}}

  .thermo-row{display:flex; gap:26px; justify-content:center; align-items:flex-end;}
  .thermo-item{display:flex; flex-direction:column; align-items:center; gap:8px;}
  .thermo{width:24px; height:110px; border:2px solid var(--ink); border-radius:14px; position:relative; overflow:hidden; background:#fff; display:flex; align-items:flex-end;}
  .thermo-fill{width:100%; background:linear-gradient(to top, var(--error), var(--marigold)); transition:height .4s;}
  .thermo-label{font-size:12px; font-weight:600; color:var(--ink-soft); text-align:center; line-height:1.4;}

  .time-strip{display:flex; align-items:center; gap:14px; justify-content:center;}
  .time-box{background:var(--indigo); color:#fff; font-family:'Fraunces',serif; font-size:16px; font-weight:700; padding:10px 16px; border-radius:8px; text-align:center;}
  .time-box .tb-label{display:block; font-size:10px; font-weight:500; color:#CBD8EC; margin-top:2px; font-family:'Work Sans',sans-serif;}
  .time-arrow{font-size:20px; color:var(--peacock);}
  .time-duration{margin-top:12px; text-align:center; font-size:13.5px; color:var(--ink-soft);}

  .clue-block{margin-bottom:12px;}
  .clue-toggle{display:inline-block; font-size:13px; color:var(--marigold-dark); cursor:pointer; font-weight:600; padding:5px 12px; border:1.5px dashed #E0BE73; border-radius:20px; background:#FFFAF0;}
  .clue-toggle:hover{background:#FCEFD8;}
  .clue-text{display:none; margin-top:8px; padding:10px 14px; background:#FFF8EA; border-left:3px solid var(--marigold); border-radius:6px; font-size:13.5px; color:var(--ink-soft); line-height:1.5;}
  .clue-text.show{display:block;}
  .meaning-block{margin-top:8px;}
  .meaning-toggle{display:inline-block; font-size:13px; color:var(--peacock); cursor:pointer; font-weight:600; padding:5px 12px; border:1.5px dashed #A9CFC5; border-radius:20px; background:#F2F9F6;}
  .meaning-toggle:hover{background:#E6F3EE;}
  .meaning-text{display:none; margin-top:8px; padding:10px 14px; background:#F2F9F6; border-left:3px solid var(--peacock); border-radius:6px; font-size:13.5px; color:var(--ink-soft); line-height:1.5;}
  .meaning-text.show{display:block;}
  .watch-translation{margin-top:6px; font-size:13px; font-style:italic; color:var(--ink-soft); text-align:center; opacity:0.85;}

  .kw-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:4px;}
  .kw-panel{border:1.5px solid var(--line); border-top-width:4px; border-radius:10px; padding:16px 18px; background:#FCFBF7;}
  .kw-panel[data-op="add"]{border-top-color:var(--peacock);}
  .kw-panel[data-op="sub"]{border-top-color:var(--error);}
  .kw-panel[data-op="mul"]{border-top-color:var(--marigold-dark);}
  .kw-panel[data-op="div"]{border-top-color:var(--indigo);}
  .kw-symbol{width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:17px; font-weight:700; color:#fff; margin-bottom:8px;}
  .kw-symbol[data-op="add"]{background:var(--peacock);}
  .kw-symbol[data-op="sub"]{background:var(--error);}
  .kw-symbol[data-op="mul"]{background:var(--marigold-dark);}
  .kw-symbol[data-op="div"]{background:var(--indigo);}
  .kw-name{font-family:'Fraunces',serif; font-weight:700; font-size:16px; margin-bottom:8px; color:var(--ink);}
  .kw-chips{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px;}
  .kw-chip{font-size:11.5px; background:#fff; border:1px solid var(--line); border-radius:20px; padding:3px 9px; color:var(--ink-soft);}
  .kw-example{font-size:12.5px; color:var(--ink-soft); font-style:italic; line-height:1.5;}
  .kw-options{flex-direction:row; flex-wrap:wrap;}
  .kw-options .opt-btn{flex:1 1 auto; min-width:150px; text-align:center;}
  @media (max-width:600px){ .kw-grid{grid-template-columns:1fr;} }

  /* Geometry */
  .angle-wrap{display:flex; flex-direction:column; align-items:center; gap:10px;}
  .angle-box{position:relative; width:160px; height:120px;}
  .angle-arm{position:absolute; left:8px; bottom:8px; width:130px; height:3px; background:var(--peacock); transform-origin:0% 50%; border-radius:2px;}
  .angle-arm.base{background:var(--ink);}
  .angle-arm.rot{background:var(--marigold-dark);}
  .angle-vertex{position:absolute; left:4px; bottom:4px; width:8px; height:8px; border-radius:50%; background:var(--ink); z-index:2;}
  .angle-label{font-size:14px; font-weight:700; color:var(--ink);}

  .lines-box{position:relative; width:180px; height:100px; margin:0 auto;}
  .line-h{position:absolute; left:6px; right:6px; height:3px; background:var(--indigo); border-radius:2px;}
  .line-v{position:absolute; top:6px; bottom:6px; width:3px; background:var(--marigold-dark); border-radius:2px;}
  .right-angle-mark{position:absolute; top:calc(50% - 14px); left:calc(50%); width:14px; height:14px; border:2px solid var(--error); border-left:none; border-bottom:none;}

  .tri-wrap{position:relative; width:180px; height:140px; margin:0 auto;}
  .triangle-shape{width:0; height:0; border-left:80px solid transparent; border-right:80px solid transparent; border-bottom:120px solid var(--marigold); opacity:.3; margin:10px auto 0;}
  .tri-label{position:absolute; font-weight:700; font-size:13px; color:var(--ink);}
  .tri-top{top:0; left:50%; transform:translateX(-50%);}
  .tri-left{bottom:6px; left:14px;}
  .tri-right{bottom:6px; right:14px;}

  .quad-wrap{position:relative; width:150px; height:110px; margin:14px auto;}
  .quad-shape{position:absolute; inset:0; background:var(--indigo); opacity:.15; border:2px solid var(--indigo); border-radius:6px;}
  .quad-label{position:absolute; font-weight:700; font-size:12.5px; color:var(--ink);}
  .ql-tl{top:-18px; left:0;} .ql-tr{top:-18px; right:0;} .ql-br{bottom:-18px; right:0;} .ql-bl{bottom:-18px; left:0;}

  .circle-wrap{display:flex; flex-direction:column; align-items:center; gap:10px;}
  .circle-shape{position:relative; width:140px; height:140px; border:3px solid var(--indigo); border-radius:50%;}
  .circle-center{position:absolute; left:50%; top:50%; width:7px; height:7px; background:var(--marigold-dark); border-radius:50%; transform:translate(-50%,-50%); z-index:2;}
  .circle-radius-line{position:absolute; left:50%; top:50%; width:68px; height:2.5px; background:var(--marigold-dark); transform-origin:0 50%;}
  .circle-diameter-line{position:absolute; left:1px; right:1px; top:50%; height:2.5px; background:var(--peacock); transform:translateY(-50%);}
  .circle-label{font-size:13px; font-weight:600; color:var(--ink-soft);}

  /* Perimeter / Area / Volume */
  .peri-wrap{display:flex; justify-content:center; padding:14px 30px;}
  .peri-box{position:relative; border:2px solid var(--line);}
  .peri-side{position:absolute; background:var(--line); transition:background .3s; border-radius:2px;}
  .peri-side.top{top:-3px; left:-3px; right:-3px; height:5px;}
  .peri-side.bottom{bottom:-3px; left:-3px; right:-3px; height:5px;}
  .peri-side.left{top:-3px; bottom:-3px; left:-3px; width:5px;}
  .peri-side.right{top:-3px; bottom:-3px; right:-3px; width:5px;}
  .peri-side.active{background:var(--marigold);}
  .peri-dim{position:absolute; font-size:11px; font-weight:600; color:var(--ink-soft); white-space:nowrap;}
  .dim-w{bottom:-22px; left:50%; transform:translateX(-50%);}
  .dim-h{top:50%; left:-38px; transform:translateY(-50%);}

  .fill-grid{display:grid; gap:1px; background:var(--line); padding:2px; border-radius:4px; margin:0 auto; width:fit-content;}
  .fill-cell{background:#fff;}
  .fill-cell.on{background:var(--peacock);}

  .cube-row{display:flex; flex-wrap:wrap; gap:5px; justify-content:center; max-width:260px; margin:0 auto;}
  .cube-icon{width:20px; height:20px; background:var(--peacock); border-radius:3px; opacity:0; transform:scale(.6); animation:popIn .25s forwards; box-shadow:inset -3px -3px 0 rgba(0,0,0,.18);}

  /* Shapes, Nets, Symmetry */
  .net-cross{display:grid; grid-template-columns:repeat(4,32px); grid-template-rows:repeat(3,32px); gap:2px; margin:0 auto; width:fit-content;}
  .net-sq{background:var(--marigold); border:1.5px solid var(--marigold-dark); border-radius:3px;}
  .n1{grid-column:2; grid-row:1;} .n2{grid-column:1; grid-row:2;} .n3{grid-column:2; grid-row:2;}
  .n4{grid-column:3; grid-row:2;} .n5{grid-column:4; grid-row:2;} .n6{grid-column:2; grid-row:3;}

  .cube3d{position:relative; width:100px; height:96px; margin:10px auto;}
  .c3-face{position:absolute; border:1.5px solid var(--marigold-dark);}
  .c3-front{width:58px; height:58px; left:14px; top:32px; background:var(--marigold);}
  .c3-top{width:58px; height:22px; left:14px; top:8px; transform:skewX(-25deg); background:#F0C976;}
  .c3-side{width:22px; height:58px; left:72px; top:32px; transform:skewY(-25deg); background:#C4841A;}

  .shape-fact-wrap{display:flex; flex-direction:column; align-items:center; gap:10px;}
  .shape-fact-name{font-family:'Fraunces',serif; font-weight:700; font-size:16px;}
  .shape-fact-rows{display:flex; flex-direction:column; gap:5px; min-width:150px;}
  .shape-fact-row{display:flex; justify-content:space-between; font-size:13px; padding:5px 10px; border-radius:6px; background:#FCFBF7; border:1px solid var(--line); opacity:.3; transition:opacity .3s, background .3s;}
  .shape-fact-row.show{opacity:1; background:#E4F2EF; border-color:var(--peacock);}

  .sym-letter-wrap{display:flex; flex-direction:column; align-items:center; gap:12px;}
  .sym-letter-box{position:relative; width:100px; height:90px; display:flex; align-items:center; justify-content:center;}
  .sym-letter{font-family:'Fraunces',serif; font-size:64px; font-weight:700; color:var(--ink);}
  .sym-vline{position:absolute; top:0; bottom:0; left:50%; width:0; border-left:2px dashed var(--error);}
  .sym-verdict{font-size:13.5px; font-weight:700;}
  .sym-verdict.yes{color:var(--success);}
  .sym-verdict.no{color:var(--error);}

  /* Data Handling */
  .tally-row{display:flex; align-items:center; gap:2px; font-size:26px; font-family:'Fraunces',serif; color:var(--ink);}
  .tally-mark{display:inline-block;}
  .tally-mark.fifth{transform:rotate(35deg) translate(-9px,-3px); color:var(--error); margin-right:8px;}
  .tally-count{margin-left:12px; font-size:14px; color:var(--ink-soft); font-family:'Work Sans',sans-serif; font-weight:600;}

  .bar-chart{display:flex; align-items:flex-end; gap:16px; height:130px; justify-content:center;}
  .bar-col{display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%;}
  .bar-value{font-size:11.5px; font-weight:700; color:var(--indigo); margin-bottom:2px;}
  .bar-rect{width:30px; background:var(--peacock); border-radius:4px 4px 0 0; transition:height .4s;}
  .bar-label{font-size:10.5px; color:var(--ink-soft); margin-top:4px;}

  /* Mapping Skills */
  .compass-wrap{display:flex; justify-content:center;}
  .compass-circle{position:relative; width:130px; height:130px; border:2px solid var(--line); border-radius:50%;}
  .compass-dir{position:absolute; font-weight:700; font-size:15px; color:var(--ink-soft); width:26px; height:26px; display:flex; align-items:center; justify-content:center; border-radius:50%;}
  .compass-dir.n{top:0; left:50%; transform:translateX(-50%);}
  .compass-dir.s{bottom:0; left:50%; transform:translateX(-50%);}
  .compass-dir.e{right:0; top:50%; transform:translateY(-50%);}
  .compass-dir.w{left:0; top:50%; transform:translateY(-50%);}
  .compass-dir.active{color:#fff; background:var(--marigold);}
  .compass-center{position:absolute; left:50%; top:50%; width:8px; height:8px; background:var(--ink); border-radius:50%; transform:translate(-50%,-50%);}

  .scale-card{background:#fff; border:1.5px dashed var(--line); border-radius:8px; padding:14px 18px; min-width:230px; margin:0 auto;}
  .scale-row{display:flex; justify-content:space-between; gap:20px; font-size:13.5px; padding:5px 0; border-bottom:1px dashed var(--line);}
  .scale-row:last-child{border-bottom:none;}
  .scale-row.total{font-weight:700; color:var(--indigo); border-top:1.5px solid var(--ink); margin-top:4px; padding-top:8px;}

  /* Fraction type card */
  .frac-type-wrap{display:flex; flex-direction:column; align-items:center; gap:10px;}
  .frac-type-value{display:flex; flex-direction:column; align-items:center; font-family:'Fraunces',serif; font-size:26px; font-weight:700; color:var(--ink); line-height:1.15;}
  .frac-line{width:34px; height:2px; background:var(--ink); margin:2px 0;}
  .frac-type-badge{background:var(--marigold); color:#2B1E00; font-size:12.5px; font-weight:700; padding:4px 14px; border-radius:20px;}
  .frac-type-note{font-size:12.5px; color:var(--ink-soft); text-align:center; max-width:260px;}

  .ref-upload-area{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px;}
  .ref-label-input{flex:1; min-width:180px; padding:9px 12px; border-radius:8px; border:1px solid var(--line); font-size:13.5px; font-family:inherit;}
  .ref-note{font-size:12.5px; color:var(--ink-soft); background:#FAF6EC; border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin-bottom:18px; line-height:1.5;}
  .ref-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:14px;}
  .ref-card{border:1px solid var(--line); border-radius:10px; padding:10px; background:#fff; position:relative;}
  .ref-thumb{width:100%; height:100px; object-fit:cover; border-radius:6px; cursor:pointer; display:block;}
  .ref-pdf-icon{width:100%; height:100px; display:flex; align-items:center; justify-content:center; font-size:36px; background:#FAF6EC; border-radius:6px; cursor:pointer;}
  .ref-meta{margin-top:8px;}
  .ref-filename{font-size:12px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ref-date{font-size:10.5px; color:var(--ink-soft); margin-top:2px;}
  .ref-delete{display:inline-block; margin-top:6px; font-size:11px; color:var(--error); cursor:pointer; text-decoration:underline;}
  .ref-empty, .ref-loading{color:var(--ink-soft); font-size:13.5px; grid-column:1/-1;}
  .ref-lightbox{position:fixed; inset:0; background:rgba(20,20,20,.75); z-index:100; align-items:center; justify-content:center;}
  .ref-lightbox-inner{position:relative; max-width:90vw; max-height:90vh;}
  .ref-lightbox-inner img{max-width:90vw; max-height:80vh; border-radius:8px; display:block;}
  .ref-lightbox-close{position:absolute; top:-16px; right:-16px; background:#fff; border-radius:50%; width:32px; height:32px; display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer;}
  .ref-lightbox-caption{color:#fff; text-align:center; margin-top:10px; font-size:13.5px;}

  .log-form{background:#FFF8EA; border:1.5px dashed var(--marigold); border-radius:10px; padding:16px 18px; margin:14px 0 24px;}
  .log-form h4{margin:0 0 12px; font-family:'Fraunces',serif; font-size:15px; color:var(--indigo);}
  .log-row{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:12px;}
  .log-row label{display:flex; flex-direction:column; font-size:12px; color:var(--ink-soft); gap:4px; font-weight:600;}
  .log-row input{padding:8px 10px; border-radius:6px; border:1px solid var(--line); font-size:13.5px; font-family:inherit;}
  .log-notes-label{display:flex; flex-direction:column; font-size:12px; color:var(--ink-soft); gap:4px; font-weight:600; margin-bottom:12px;}
  .log-notes-label textarea{padding:8px 10px; border-radius:6px; border:1px solid var(--line); font-size:13.5px; font-family:inherit; resize:vertical;}
  .log-saved-msg{margin-left:12px; font-size:13px; color:var(--success); font-weight:600;}

  .tr-chapter-list{display:flex; flex-direction:column; gap:10px;}
  .tr-chapter-row{display:flex; align-items:center; gap:12px;}
  .tr-chapter-name{width:170px; flex-shrink:0; font-size:13px; color:var(--ink); font-weight:600;}
  .tr-chapter-bar-track{flex:1; height:10px; background:#EFEAD9; border-radius:6px; overflow:hidden;}
  .tr-chapter-bar-fill{height:100%; border-radius:6px; transition:width .3s;}
  .tr-chapter-pct{width:110px; flex-shrink:0; font-size:12.5px; font-weight:600; color:var(--ink-soft); text-align:right;}
  .tr-chapter-n{font-weight:400;}
  .tr-table{width:100%; border-collapse:collapse; font-size:13px;}
  .tr-table th{text-align:left; font-size:11.5px; text-transform:uppercase; color:var(--ink-soft); padding:8px 10px; border-bottom:2px solid var(--line);}
  .tr-table td{padding:9px 10px; border-bottom:1px solid var(--line); color:var(--ink);}
  .tr-delete{color:var(--error); cursor:pointer; text-decoration:underline; font-size:12px;}

  .compare-nums{display:flex; align-items:center; gap:18px; justify-content:center; flex-wrap:wrap;}
  .cnum{font-family:'Fraunces',serif; font-size:22px; font-weight:700; color:var(--ink);}
  .compare-vs{font-size:14px; font-weight:600; color:var(--peacock);}
  .hl-digit{background:var(--marigold); border-radius:4px; padding:0 4px;}

  .round-box{display:flex; flex-direction:column; align-items:center; gap:8px;}
  .round-original{font-family:'Fraunces',serif; font-size:22px; font-weight:700; color:var(--ink-soft);}
  .round-arrow{font-size:12.5px; color:var(--peacock); font-weight:600;}
  .round-result{font-family:'Fraunces',serif; font-size:28px; font-weight:700; color:var(--marigold-dark);}

  .hcf-row{margin-bottom:12px;}
  .hcf-label{font-size:11.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
  .hcf-chips{display:flex; gap:6px; flex-wrap:wrap; justify-content:center;}
  .hcf-chip{background:#fff; border:1.5px solid var(--line); border-radius:20px; padding:4px 11px; font-size:13px; font-weight:600; color:var(--ink-soft); transition:all .25s;}
  .hcf-chip.common{background:var(--peacock); border-color:var(--peacock); color:#fff;}

  .col-cell.dp{width:10px; font-weight:700;}
  .col-cell.result-cell{color:var(--peacock); font-weight:700;}

  .bodmas-card{display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center;}
  .bodmas-letters{font-family:'Fraunces',serif; font-size:30px; font-weight:700; color:var(--indigo); letter-spacing:.05em;}
  .bodmas-full{font-size:13px; color:var(--ink-soft); max-width:280px; line-height:1.6;}

  .ar-block{background:#FAF6EC; border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:14px; position:relative; padding-left:34px;}
  .ar-num{position:absolute; left:12px; top:12px; font-weight:700; color:var(--ink-soft); font-size:14px;}
  .ar-line{font-size:14.5px; line-height:1.6; margin-bottom:6px;}
  .ar-line:last-child{margin-bottom:0;}
  .q-tag.ar-tag{color:var(--indigo); background:#E7ECF6;}

  .grp-num-row{display:flex; align-items:flex-end; justify-content:center; gap:2px; flex-wrap:wrap;}
  .grp-num-item{display:flex; flex-direction:column; align-items:center;}
  .grp-num-digits{font-family:'Fraunces',serif; font-size:26px; font-weight:700; color:var(--ink);}
  .grp-num-label{font-size:10px; color:var(--ink-soft); margin-top:4px; text-transform:uppercase; letter-spacing:.03em;}
  .grp-num-comma{font-size:26px; font-weight:700; color:var(--ink-soft); align-self:flex-end; margin-bottom:2px;}

  @media print{
    .sidebar, .topbar, .tabbar, .setup-card, .paper-actions, .main::before{display:none !important;}
    .main{background:#fff;} .content{padding:0;} .paper{border:none; max-width:100%;}
  }
  @media (max-width: 760px){
    .app{flex-direction:column;} .sidebar{width:100%;}
    .main::before{left:22px;} .topbar, .content{padding-left:34px; padding-right:20px;}
  }
</style>
</head>

<script>
/* ===================== DATA ===================== */
/* Chapters match the exact contents page of Collins Perfect Maths 5 (2nd Edition) used at DAV, Adambakkam. */

const chapters_maths_g5_cbse = [
  {
    id:"ch1", title:"1. Large Numbers",
    concepts:[
      "<b>Indian place value system:</b> Ones, Tens, Hundreds, Thousands, Ten Thousands, Lakhs, Ten Lakhs, Crores, Ten Crores — used to read and write numbers up to 8 digits and beyond.",
      "<b>Writing large numbers:</b> commas go 3-2-2 from the right — e.g. 12,34,567 (twelve lakh thirty-four thousand five hundred sixty-seven), or for 8 digits, 1,23,45,678 (one crore twenty-three lakh forty-five thousand six hundred seventy-eight).",
      "<b>International Number System:</b> groups every digit in 3s — Ones, Thousands, Millions. The same number 1,23,45,678 (Indian) is written 12,345,678 and read as 'twelve million three hundred forty-five thousand six hundred seventy-eight'.",
      "<b>Comparing numbers:</b> compare digit count first; if equal, compare digits left to right.",
      "<b>Rounding off:</b> round to the nearest ten/hundred/thousand for quick estimates — check the digit just after the place you're rounding to.",
      "<b>Addition &amp; subtraction of big numbers:</b> line up place values carefully before calculating."
    ],
    practice:[
      {type:"mcq", marks:1, q:"The place value of 7 in 4,72,905 is:", options:["7","700","7,000","70,000"], answer:3, explain:"7 sits in the ten-thousands place, so its place value is 7 × 10,000 = 70,000."},
      {type:"mcq", marks:1, q:"Which of these is the smallest number?", options:["45,678","45,687","45,768","45,876"], answer:0, explain:"All four numbers start with 45; comparing the hundreds digit (6<7<8) and then tens digit, 45,678 is smallest."},
      {type:"mcq", marks:1, q:"3,45,000 rounded to the nearest thousand is:", options:["3,44,000","3,45,000","3,46,000","3,50,000"], answer:1, explain:"3,45,000 already ends in 000, so rounding leaves it unchanged."},
      {type:"mcq", marks:1, q:"One lakh equals:", options:["10 thousand","100 thousand","1,000 thousand","10,000 hundred"], answer:1, explain:"1,00,000 = 100 × 1,000."},
      {type:"short", marks:2, q:"Write 8,05,020 in words (Indian system).", answer:"eight lakh five thousand twenty", explain:"Split as 8 | 05 | 020 → 'Eight lakh five thousand twenty'."},
      {type:"short", marks:2, q:"Arrange in descending order: 90,909; 9,099; 99,090; 9,909 (comma-separated, largest first).", answer:"99,090, 90,909, 9,909, 9,099", explain:"5-digit numbers come before 4-digit ones. 99,090 > 90,909 (compare ten-thousands then thousands digit). Among the rest, 9,909 > 9,099."},

      "<b>Adjective (\u0935\u093f\u0936\u0947\u0937\u0923):</b> describes a noun \u2014 the book's own examples from this poem include ठंडी हवा (cold wind), सुंदर सीप (beautiful oyster), गहरा समुद्र (deep sea), चमकीला मोती (shining pearl).",

      "<b>Rhyming words (तुकांत) \u2014 real examples from the book's own exercise, testing this poem's vocabulary specifically:</b> धूल rhymes with फूल; गिर rhymes with फिर."

let activeBoardId = "cbse";
let activeGradeId = "g5";
function getBoard(id){ return curriculumCatalog.find(b=>b.id===id); }
function getGrade(boardId, gradeId){ const b=getBoard(boardId); return b ? b.grades.find(g=>g.id===gradeId) : null; }
function getActiveSubjects(){ const g = getGrade(activeBoardId, activeGradeId); return g ? g.subjects : []; }

let subjects = getActiveSubjects();
let chapters = chapters_maths_g5_cbse;

function initChapterState(){
  state.scores = {};
  state.watchState = {};
  chapters.forEach(c => {
    state.scores[c.id] = {correct:0, attempted:0, answered:{}};
    state.watchState[c.id] = {lessonIndex:0, sceneIndex:0, playing:false, narrate:true};
  });
}

function switchSubject(subjectId){
  const subj = subjects.find(s=>s.id===subjectId);
  if(!subj) return;
  state.subject = subjectId;
  if(subj.ready){
    chapters = subj.chapters;
    initChapterState();
    state.chapterId = chapters[0] ? chapters[0].id : null;
  } else {
    chapters = [];
    state.chapterId = null;
  }
  state.view = 'concepts';
  stopNarration();
  render();
}

function switchGrade(gradeId){
  activeGradeId = gradeId;
  subjects = getActiveSubjects();
  const firstReady = subjects.find(s=>s.ready) || subjects[0];
  if(firstReady) switchSubject(firstReady.id);
}

function switchBoard(boardId){
  activeBoardId = boardId;
  const board = getBoard(boardId);
  const firstGrade = board && board.grades[0];
  if(firstGrade) switchGrade(firstGrade.id);
}

function isActiveSubjectReady(){
  const s = subjects.find(x=>x.id===state.subject);
  return !!(s && s.ready);
}

/* ===================== WATCH & LEARN: visual helpers ===================== */
function pvRow(digits, activeIndex, valueText){
  const labels = ["Lakhs","Ten Th.","Thousands","Hundreds","Tens","Ones"];
  return `<div class="pv-row">` + digits.map((d,i)=>{
    const isActive = activeIndex===-2 || i===activeIndex;
    return `<div class="pv-box ${isActive?'active':''}">
        ${(i===activeIndex && valueText) ? `<div class="pv-value-bubble">${valueText}</div>` : ''}
        <div class="pv-digit">${d}</div>
        <div class="pv-label">${labels[i]}</div>
      </div>`;
  }).join('') + `</div>`;
}

function colOp(top, bottom, carries, result, op, highlightCol){
  const cell = (d,hl) => `<span class="col-cell ${hl?'hl':''}">${d===null||d===undefined?'':d}</span>`;
  return `<div class="col-op">
      <div class="col-op-row carries"><span class="col-op-sign"></span>${carries.map((c,i)=>cell(c,i===highlightCol)).join('')}</div>
      <div class="col-op-row"><span class="col-op-sign"></span>${top.map((d,i)=>cell(d,i===highlightCol)).join('')}</div>
      <div class="col-op-row"><span class="col-op-sign">${op}</span>${bottom.map((d,i)=>cell(d,i===highlightCol)).join('')}</div>
      <div class="col-op-line"></div>
      <div class="col-op-row result"><span class="col-op-sign"></span>${result.map((d,i)=>cell(d,i===highlightCol)).join('')}</div>
    </div>`;
}

function groupBoxes(numGroups, perGroup, groupsFilled){
  let html = `<div class="groups-row">`;
  for(let g=0; g<numGroups; g++){
    const filled = g < groupsFilled ? perGroup : 0;
    html += `<div class="group-box"><div class="group-label">Group ${g+1}</div><div class="dots">`;
    for(let i=0;i<perGroup;i++){ html += `<span class="item-dot ${i<filled?'on':''}">\uD83C\uDF4E</span>`; }
    html += `</div></div>`;
  }
  return html + `</div>`;
}

function basketShare(numBaskets, roundsFilled){
  let html = `<div class="groups-row">`;
  for(let b=0; b<numBaskets; b++){
    html += `<div class="group-box"><div class="group-label">Basket ${b+1}</div><div class="dots">`;
    for(let i=0;i<3;i++){ html += `<span class="item-dot ${i<roundsFilled?'on':''}">\uD83C\uDF4E</span>`; }
    html += `</div></div>`;
  }
  return html + `</div>`;
}

function numberLine(maxVal, aStops, bStops, highlight){
  let ticks = '';
  for(let v=0; v<=maxVal; v+=4){ ticks += `<div class="nl-tick" style="left:${v/maxVal*100}%"><span>${v}</span></div>`; }
  const aDots = aStops.map(v=>`<div class="nl-dot nl-a" style="left:${v/maxVal*100}%">A</div>`).join('');
  const bDots = bStops.map(v=>`<div class="nl-dot nl-b" style="left:${v/maxVal*100}%">B</div>`).join('');
  const hl = highlight ? `<div class="nl-highlight" style="left:${highlight/maxVal*100}%"></div>` : '';
  return `<div class="number-line-wrap"><div class="number-line">${ticks}${aDots}${bDots}${hl}</div></div>`;
}

function fractionBar(total, shaded){
  let cells='';
  for(let i=0;i<total;i++){ cells += `<div class="frac-cell ${i<shaded?'on':''}"></div>`; }
  return `<div class="frac-bar">${cells}</div>`;
}

function fractionCompare(items){
  return `<div class="frac-compare">` + items.map(it=>`
    <div class="frac-row ${it.winner?'winner':''}">
      ${fractionBar(it.total, it.shaded)}
      <div class="frac-label">${it.label}</div>
    </div>`).join('') + `</div>`;
}

function decimalGrid(filled){
  let cells='';
  for(let i=0;i<100;i++){ cells += `<div class="decimal-cell ${i<filled?'on':''}"></div>`; }
  return `<div class="decimal-grid">${cells}</div>`;
}

function gridCompare(items){
  return `<div class="groups-row">` + items.map(it=>`
    <div class="grid-compare-item"><div class="group-label">${it.label}</div>${decimalGrid(it.filled)}</div>`).join('') + `</div>`;
}

function receipt(lines){
  return `<div class="receipt">` + lines.map((l,i)=>
    `<div class="receipt-line ${l.total?'total':''}" style="animation-delay:${i*0.08}s"><span>${l.label}</span><span>${l.amount}</span></div>`
  ).join('') + `</div>`;
}

function meterBlocks(fullCount, remainder, fullUnitLabel, remainderUnitSuffix){
  fullUnitLabel = fullUnitLabel || '1 m';
  remainderUnitSuffix = remainderUnitSuffix || 'cm';
  let html = `<div class="m-blocks-row">`;
  for(let i=0;i<fullCount;i++){ html += `<div class="m-block" style="animation-delay:${i*0.1}s">${fullUnitLabel}</div>`; }
  if(remainder>0){ html += `<div class="m-block partial" style="animation-delay:${fullCount*0.1}s">${remainder} ${remainderUnitSuffix}</div>`; }
  return html + `</div>`;
}

function thermoRow(items){
  return `<div class="thermo-row">` + items.map(it=>{
    const min = it.min!==undefined?it.min:-10, max = it.max!==undefined?it.max:40;
    const pct = Math.max(0,Math.min(100, (it.value-min)/(max-min)*100));
    return `<div class="thermo-item">
        <div class="thermo"><div class="thermo-fill" style="height:${pct}%"></div></div>
        <div class="thermo-label">${it.label}<br>${it.value}°C</div>
      </div>`;
  }).join('') + `</div>`;
}

function timeStrip(start, startLabel, end, endLabel, duration){
  return `<div class="time-strip">
      <div class="time-box">${start}<span class="tb-label">${startLabel}</span></div>
      <div class="time-arrow">&#8594;</div>
      <div class="time-box">${end}<span class="tb-label">${endLabel}</span></div>
    </div>` + (duration ? `<div class="time-duration">Duration: <b>${duration}</b></div>` : '');
}

/* ---- Geometry ---- */
function angleDiagram(degrees, typeLabel){
  return `<div class="angle-wrap">
      <div class="angle-box">
        <div class="angle-vertex"></div>
        <div class="angle-arm base"></div>
        <div class="angle-arm rot" style="transform:rotate(-${degrees}deg)"></div>
      </div>
      <div class="angle-label">${degrees}°${typeLabel?' — '+typeLabel:''}</div>
    </div>`;
}

function linesDiagram(type){
  if(type==='parallel'){
    return `<div class="lines-box"><div class="line-h" style="top:32%"></div><div class="line-h" style="top:64%"></div></div>`;
  } else if(type==='perpendicular'){
    return `<div class="lines-box"><div class="line-h" style="top:50%"></div><div class="line-v" style="left:50%"></div><div class="right-angle-mark"></div></div>`;
  }
  return `<div class="lines-box"><div class="line-h" style="top:50%; transform:rotate(14deg)"></div><div class="line-h" style="top:50%; transform:rotate(-22deg)"></div></div>`;
}

function triangleSum(a,b,c, revealCount){
  const vals=[a,b,c];
  return `<div class="tri-wrap">
      <div class="triangle-shape"></div>
      <div class="tri-label tri-top">${revealCount>=1?vals[0]+'°':''}</div>
      <div class="tri-label tri-left">${revealCount>=2?vals[1]+'°':''}</div>
      <div class="tri-label tri-right">${revealCount>=3?vals[2]+'°':''}</div>
    </div>`;
}

function quadSum(angles, revealCount){
  return `<div class="quad-wrap">
      <div class="quad-shape"></div>
      <div class="quad-label ql-tl">${revealCount>=1?angles[0]+'°':''}</div>
      <div class="quad-label ql-tr">${revealCount>=2?angles[1]+'°':''}</div>
      <div class="quad-label ql-br">${revealCount>=3?angles[2]+'°':''}</div>
      <div class="quad-label ql-bl">${revealCount>=4?angles[3]+'°':''}</div>
    </div>`;
}

/* ---- Perimeter, Area, Volume ---- */
function perimeterBox(w,h, activeSides){
  const on = s => activeSides.includes(s) ? 'active' : '';
  return `<div class="peri-wrap">
      <div class="peri-box" style="width:${w*16}px; height:${h*16}px;">
        <div class="peri-side top ${on('top')}"></div>
        <div class="peri-side right ${on('right')}"></div>
        <div class="peri-side bottom ${on('bottom')}"></div>
        <div class="peri-side left ${on('left')}"></div>
        <div class="peri-dim dim-w">${w} cm</div>
        <div class="peri-dim dim-h">${h} cm</div>
      </div>
    </div>`;
}

function gridFill(cols, rows, filled, cellSize){
  cellSize = cellSize || 16;
  let cells='';
  const total = cols*rows;
  for(let i=0;i<total;i++){ cells += `<div class="fill-cell ${i<filled?'on':''}" style="width:${cellSize}px;height:${cellSize}px;"></div>`; }
  return `<div class="fill-grid" style="grid-template-columns:repeat(${cols}, ${cellSize}px);">${cells}</div>`;
}

function cubeRow(count){
  let html='';
  for(let i=0;i<count;i++){ html += `<div class="cube-icon" style="animation-delay:${i*0.06}s"></div>`; }
  return `<div class="cube-row">${html}</div>`;
}

function cube3d(){

let cachedVoices = [];
function loadVoices(){
  if(window.speechSynthesis){
    cachedVoices = window.speechSynthesis.getVoices() || [];
    if(window.speechSynthesis.onvoiceschanged !== undefined){
      window.speechSynthesis.onvoiceschanged = () => {
        cachedVoices = window.speechSynthesis.getVoices() || [];
        if(state.view === 'watch') render();
      };
    }
  }
}
loadVoices();

function isDevanagariText(text){
  return /[\u0900-\u097F]/.test(text || '');
}

function pickBestHindiVoice(){
  if(!cachedVoices.length) loadVoices();
  if(!cachedVoices.length) return null;
  const hindiVoices = cachedVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith('hi'));
  if(!hindiVoices.length) return null;
  const scored = hindiVoices.map(v => {
    let score = 0;
    const name = v.name.toLowerCase();
    if(name.includes('natural')) score += 4;
    if(name.includes('online') || name.includes('neural')) score += 3;
    if(name.includes('google')) score += 2;
    if(name.includes('microsoft')) score += 1;
    if(name.includes('female') || /\b(swara|kalpana|female)\b/.test(name)) score += 1;
    return {v, score};
  });
  scored.sort((a,b)=>b.score-a.score);
  return scored[0].v;
}

function pickBestVoiceForText(text){
  return isDevanagariText(text) ? pickBestHindiVoice() : pickBestVoice();
}

function pickBestVoice(){
  if(!cachedVoices.length) loadVoices();
  if(!cachedVoices.length) return null;
  if(state.selectedVoiceURI){
    const manual = cachedVoices.find(v => v.voiceURI === state.selectedVoiceURI);
    if(manual) return manual;
  }
  const englishVoices = cachedVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  const pool = englishVoices.length ? englishVoices : cachedVoices;
  const indianNames = ['heera','ravi','veena','rishi','priya','indian','neerja','swara','aditi'];
  const scored = pool.map(v => {
    let score = 0;
    const name = v.name.toLowerCase();
    const lang = (v.lang||'').toLowerCase();
    if(lang.startsWith('en-in')) score += 6;
    if(indianNames.some(n => name.includes(n))) score += 5;
    if(name.includes('natural')) score += 4;
    if(name.includes('online') || name.includes('neural')) score += 3;
    if(name.includes('google')) score += 2;
    if(name.includes('microsoft')) score += 1;
    if(name.includes('female') || /\b(zira|susan|samantha|female)\b/.test(name)) score += 1;
    if(v.localService === false) score += 1;
    return {v, score};
  });
  scored.sort((a,b)=>b.score-a.score);
  return scored[0] ? scored[0].v : pool[0];
}

function getIndianVoiceOptions(){
  if(!cachedVoices.length) loadVoices();
  const english = cachedVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  const pool = english.length ? english : cachedVoices;
  // Indian-language/accent voices first, then the rest of the English voices
  const isIndianish = v => (v.lang||'').toLowerCase().startsWith('en-in') || /heera|ravi|veena|rishi|priya|indian|neerja|swara|aditi/i.test(v.name);
  const indian = pool.filter(isIndianish);
  const rest = pool.filter(v => !isIndianish(v));
  return [...indian, ...rest];
}

function stopNarration(){
  if(watchTimer){ clearTimeout(watchTimer); watchTimer = null; }
  if(window.speechSynthesis){ window.speechSynthesis.cancel(); }
}

function renderWatchHTML(chapter){
  if(!chapter.watch){
    return `<div class="placeholder"><b>Coming in the next batch</b>The animated explainer for this chapter hasn't been built yet — it's on the list!</div>`;
  }
  const ws = state.watchState[chapter.id];
  const lessons = chapter.watch.lessons;
  const lesson = lessons[ws.lessonIndex];
  const scenes = lesson.scenes;
  const scene = scenes[ws.sceneIndex];
  const total = scenes.length;

  const picker = lessons.length > 1 ? `
    <div class="lesson-picker">
      ${lessons.map((l,i)=>`<div class="lesson-chip ${i===ws.lessonIndex?'on':''}" data-lesson="${i}">${i+1}. ${l.title}</div>`).join('')}
    </div>` : '';

  return `
    ${picker}
    <div class="watch-card">
      <div class="watch-lesson-title">${lesson.title}</div>
      <div class="watch-stage" id="watchStage">${scene.html}</div>

      <div class="watch-controls">

        <button class="watch-icon-btn primary" id="wPlay" title="Play/Pause">${ws.playing?'&#10073;&#10073;':'&#9654;'}</button>
        <button class="watch-icon-btn" id="wNext" title="Next" ${ws.sceneIndex===total-1?'disabled':''}>&#8594;</button>
        <button class="watch-icon-btn" id="wReplay" title="Replay from start">&#8635;</button>
        <div class="watch-dots" id="watchDots">
          ${scenes.map((s,i)=>`<div class="watch-dot ${i===ws.sceneIndex?'on':''}" data-i="${i}"></div>`).join('')}
        </div>
        <span class="watch-narrate-toggle" id="wNarrate">${ws.narrate?'\uD83D\uDD0A Narration on':'\uD83D\uDD07 Narration off'}</span>
      </div>

function buildVoiceOptionsHTML(){
  const voices = getIndianVoiceOptions();
  if(!voices.length) return `<option value="">Default (device voice)</option>`;
  const isIndianish = v => (v.lang||'').toLowerCase().startsWith('en-in') || /heera|ravi|veena|rishi|priya|indian|neerja|swara|aditi/i.test(v.name);
  return `<option value="">Auto (best available)</option>` + voices.map(v=>{
    const selected = state.selectedVoiceURI === v.voiceURI ? 'selected' : '';
    return `<option value="${v.voiceURI}" ${selected}>${isIndianish(v)?'\uD83C\uDDEE\uD83C\uDDF3 ':''}${v.name} (${v.lang})</option>`;
  }).join('');
}

function speakCaption(chapter){
  const ws = state.watchState[chapter.id];
  const speechOk = !!(window.speechSynthesis && typeof window.SpeechSynthesisUtterance !== 'undefined');
  if(!ws.narrate || !speechOk){ scheduleAdvance(chapter, 3200); return; }
  try{
    window.speechSynthesis.cancel();
    const scene = currentLessonScenes(chapter)[ws.sceneIndex];
    const utter = new SpeechSynthesisUtterance(scene.caption);
    const isHindi = isDevanagariText(scene.caption);
    const voice = pickBestVoiceForText(scene.caption);
    if(voice) utter.voice = voice;
    else if(isHindi) utter.lang = 'hi-IN'; // no Hindi voice installed — still hint the engine, better than defaulting to English pronunciation
    utter.rate = 0.92;
    utter.pitch = 1.02;
    utter.onend = () => { if(state.watchState[chapter.id].playing) scheduleAdvance(chapter, 400); };
    utter.onerror = () => { if(state.watchState[chapter.id].playing) scheduleAdvance(chapter, 1500); };
    window.speechSynthesis.speak(utter);
  } catch(e){
    scheduleAdvance(chapter, 3200);
  }
}

function scheduleAdvance(chapter, delay){
  if(watchTimer) clearTimeout(watchTimer);
  watchTimer = setTimeout(()=>{
    const ws = state.watchState[chapter.id];
    if(!ws.playing) return;
    const total = currentLessonScenes(chapter).length;
    if(ws.sceneIndex < total-1){
      ws.sceneIndex++;
      render();
      speakCaption(chapter);
    } else {
      ws.playing = false;
      render();
    }
  }, delay);
}

function wireWatchInteractions(chapter){
  const ws = state.watchState[chapter.id];
  const total = currentLessonScenes(chapter).length;

  document.querySelectorAll('.lesson-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      stopNarration();
      ws.lessonIndex = parseInt(chip.dataset.lesson);
      ws.sceneIndex = 0;
      ws.playing = false;
      render();
    });
  });

  document.getElementById('wPrev').addEventListener('click', ()=>{
    stopNarration(); ws.playing=false;
    ws.sceneIndex = Math.max(0, ws.sceneIndex-1);
    render();
  });
  document.getElementById('wNext').addEventListener('click', ()=>{
    stopNarration(); ws.playing=false;
    ws.sceneIndex = Math.min(total-1, ws.sceneIndex+1);
    render();
  });
  document.getElementById('wReplay').addEventListener('click', ()=>{
    stopNarration(); ws.playing=false; ws.sceneIndex=0;
    render();
  });
  document.getElementById('wPlay').addEventListener('click', ()=>{
    if(ws.playing){
      ws.playing=false; stopNarration(); render();
    } else {
      ws.playing=true;
      if(ws.sceneIndex===total-1) ws.sceneIndex=0;
      render();
      speakCaption(chapter);
    }
  });
  document.getElementById('wNarrate').addEventListener('click', ()=>{
    ws.narrate = !ws.narrate;
    stopNarration();
    render();
    if(ws.playing){ speakCaption(chapter); }
  });
  const voiceSelect = document.getElementById('wVoiceSelect');
  if(voiceSelect){
    voiceSelect.addEventListener('change', ()=>{
      state.selectedVoiceURI = voiceSelect.value || null;
      try{
        if(window.localStorage){
          if(state.selectedVoiceURI) localStorage.setItem('kayalini_voice_uri', state.selectedVoiceURI);
          else localStorage.removeItem('kayalini_voice_uri');
        }
      } catch(e){}
      stopNarration();
      if(ws.playing){ speakCaption(chapter); }
    });
  }
  document.querySelectorAll('#watchDots .watch-dot').forEach(dot=>{
    dot.addEventListener('click', ()=>{
      stopNarration(); ws.playing=false;
      ws.sceneIndex = parseInt(dot.dataset.i);
      render();
    });
  });
}

/* ===================== STORAGE: Reference Library (IndexedDB) ===================== */
let refDB = null;
function openRefDB(){
  return new Promise((resolve, reject)=>{
    if(refDB){ resolve(refDB); return; }
    if(!window.indexedDB){ reject(new Error('IndexedDB not supported')); return; }
    const req = indexedDB.open('KayaliniStudyDB', 1);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('references')){
        const store = db.createObjectStore('references', {keyPath:'id', autoIncrement:true});
        store.createIndex('scope', 'scope', {unique:false});
      }
    };
    req.onsuccess = (e)=>{ refDB = e.target.result; resolve(refDB); };
    req.onerror = (e)=>{ reject(e.target.error); };
  });
}

function addReference(record){
  return openRefDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction('references','readwrite');
    const store = tx.objectStore('references');
    const req = store.add(record);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = (e)=>reject(e.target.error);
  }));
}

function getReferencesByScope(scope){
  return openRefDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction('references','readonly');
    const store = tx.objectStore('references');
    const idx = store.index('scope');
    const req = idx.getAll(scope);
    req.onsuccess = ()=>resolve(req.result || []);
    req.onerror = (e)=>reject(e.target.error);
  }));
}

function deleteReference(id){
  return openRefDB().then(db=>new Promise((resolve,reject)=>{
    const tx = db.transaction('references','readwrite');
    const store = tx.objectStore('references');
    const req = store.delete(id);
    req.onsuccess = ()=>resolve();
    req.onerror = (e)=>reject(e.target.error);
  }));
}

function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function dataURLToBlobURL(dataURL){
  const parts = dataURL.split(',');
  const meta = parts[0].match(/:(.*?);/);
  const mime = meta ? meta[1] : 'application/octet-stream';
  const binary = atob(parts[1]);
  const arr = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++){ arr[i] = binary.charCodeAt(i); }
  const blob = new Blob([arr], {type:mime});
  return URL.createObjectURL(blob);
}

      <div class="tab ${state.view==='references'?'active':''}" data-view="references">References</div>
    </div>`;

  if(state.view === 'concepts'){
    html += `<div class="concept-card"><h3>Key ideas</h3><ul>${chapter.concepts.map(c=>`<li>${c}</li>`).join('')}</ul></div>`;
  } else if(state.view === 'watch'){
    html += renderWatchHTML(chapter);
  } else if(state.view === 'references'){
    html += renderReferenceSectionHTML(chapter.id, chapter.title.replace(/^\d+\.\s/,''));
  } else {
    const sc = state.scores[chapter.id];
    const pct = sc.attempted ? Math.round(sc.correct/sc.attempted*100) : 0;
    html += `<div class="score-bar">
        <div class="num">${sc.correct}/${sc.attempted} correct</div>
        <div class="track"><div class="fill" style="width:${pct}%"></div></div>
        <div class="reset" id="resetScore">Reset</div>
      </div>`;
    html += chapter.practice.map((q,i)=>renderQuestion(chapter.id, q, i)).join('');
  }
  content.innerHTML = html;

  content.querySelectorAll('.tab').forEach(t=>t.addEventListener('click', ()=>{
    if(t.dataset.view === 'watch' && !chapter.watch) return;
    stopNarration();
    state.view = t.dataset.view;
    render();
  }));
  if(state.view==='practice'){
    wireQuestionInteractions(chapter);
    const rs = document.getElementById('resetScore');
    if(rs) rs.addEventListener('click', ()=>{
      state.scores[chapter.id] = {correct:0, attempted:0, answered:{}};
      render();
    });
  } else if(state.view==='watch' && chapter.watch){
    wireWatchInteractions(chapter);
  } else if(state.view==='references'){
    wireReferenceSection(chapter.id);
  }
}

function renderQuestion(chapterId, q, idx){
  const isHots = q.marks >= 4;
  const qid = chapterId+'-'+idx;
  let body = '';
  let questionText = q.q || '';
  if(q.type === 'mcq'){
    body = `<div class="options">` + q.options.map((o,i)=>
      `<button class="opt-btn" data-qid="${qid}" data-i="${i}">${o}</button>`
    ).join('') + `</div>`;
  } else if(q.type === 'ar'){
    questionText = `<div class="ar-block">
        <div class="ar-line ar-num">${idx+1}.</div>
        <div class="ar-line"><b>Assertion (A):</b> ${q.assertion}</div>
        <div class="ar-line"><b>Reason (R):</b> ${q.reason}</div>
      </div>`;
    body = `<div class="options">` + AR_OPTIONS.map((o,i)=>
      `<button class="opt-btn" data-qid="${qid}" data-i="${i}">(${String.fromCharCode(97+i)}) ${o}</button>`
    ).join('') + `</div>`;
  } else {
    body = `<div class="answer-row">
        <input type="text" placeholder="Type your answer" id="input-${qid}">
        <button class="btn" data-check="${qid}">Check</button>
      </div>`;
  }
  const clueBlock = q.clue ? `
      <div class="clue-block">
        <span class="clue-toggle" data-clue-toggle="${qid}">\uD83D\uDCA1 Need a clue?</span>
        <div class="clue-text" id="clue-${qid}">${q.clue}</div>
      </div>` : '';
  const meaningBlock = q.qEN ? `
      <div class="meaning-block">
        <span class="meaning-toggle" data-meaning-toggle="${qid}">\uD83C\uDF10 अर्थ देखें (See meaning)</span>
        <div class="meaning-text" id="meaning-${qid}">${q.qEN}</div>
      </div>` : '';
  return `<div class="q-card" data-qcard="${qid}">
      <div class="q-meta">
        <span class="q-tag ${isHots?'hots':''} ${q.type==='ar'?'ar-tag':''}">${isHots?'HOTS · beyond textbook':(q.type==='ar'?'Assertion-Reason':'Practice')}</span>
        <span class="q-marks">${q.marks} mark${q.marks>1?'s':''}</span>
      </div>
      ${q.type==='ar' ? questionText : `<div class="q-text">${idx+1}. ${questionText}</div>`}
      ${meaningBlock}
      ${clueBlock}
      ${body}
      <div class="feedback" id="fb-${qid}"></div>
    </div>`;
}

function wireQuestionInteractions(chapter){
  chapter.practice.forEach((q, idx) => {
    const qid = chapter.id+'-'+idx;
    const sc = state.scores[chapter.id];

    if(q.qEN){
      const mtoggle = document.querySelector(`[data-meaning-toggle="${qid}"]`);
      if(mtoggle){
        mtoggle.addEventListener('click', ()=>{
          const box = document.getElementById(`meaning-${qid}`);
          box.classList.toggle('show');
          mtoggle.textContent = box.classList.contains('show') ? '\uD83C\uDF10 अर्थ छुपाएँ (Hide meaning)' : '\uD83C\uDF10 अर्थ देखें (See meaning)';
        });
      }
    }

    if(q.clue){
      const toggle = document.querySelector(`[data-clue-toggle="${qid}"]`);
      if(toggle){
        toggle.addEventListener('click', ()=>{
          const box = document.getElementById(`clue-${qid}`);
          box.classList.toggle('show');
          toggle.textContent = box.classList.contains('show') ? '\uD83D\uDCA1 Hide clue' : '\uD83D\uDCA1 Need a clue?';
        });
      }
    }

    if(q.type === 'mcq' || q.type === 'ar'){
      document.querySelectorAll(`[data-qid="${qid}"]`).forEach(btn=>{
        btn.addEventListener('click', ()=>{
          if(sc.answered[qid] !== undefined) return;
          const chosen = parseInt(btn.dataset.i);
          const correct = chosen === q.answer;
          sc.answered[qid] = correct;
          sc.attempted++; if(correct) sc.correct++;
          document.querySelectorAll(`[data-qid="${qid}"]`).forEach((b,i)=>{
            b.disabled = true;
            if(i === q.answer) b.classList.add('correct');
            else if(i === chosen) b.classList.add('wrong');
          });
          showFeedback(qid, correct, q.explain);
          updateScoreBar(chapter.id);
        });
      });
    } else {
      const check = document.querySelector(`[data-check="${qid}"]`);
      if(check){
        check.addEventListener('click', ()=>{
          if(sc.answered[qid] !== undefined) return;
          const input = document.getElementById(`input-${qid}`);
          const val = normalize(input.value);
          const correct = fuzzyMatch(val, q.answer);
          sc.answered[qid] = correct;
          sc.attempted++; if(correct) sc.correct++;
          input.disabled = true;
          check.disabled = true;
          showFeedback(qid, correct, q.explain);
          updateScoreBar(chapter.id);
        });
      }
    }
  });
}

function normalize(s){
  return (s||'').toLowerCase().replace(/[₹,]/g,'').replace(/\band\b/g,' ').replace(/\s+/g,' ').trim();
}

function extractNumbers(str){
  const matches = String(str).match(/-?\d+\.?\d*/g) || [];
  return matches.map(n => parseFloat(n));
}

function numbersMatchInOrder(inputNums, answerNums, tol){
  tol = tol || 0.005;
  let ai = 0;
  for(let i=0; i<inputNums.length && ai<answerNums.length; i++){
    if(Math.abs(inputNums[i]-answerNums[ai]) < tol) ai++;
  }
  return ai === answerNums.length;
}

function fuzzyMatchOne(val, answer){
  const a = normalize(answer);
  if(val === a) return true;
  if(val.length > 0 && a.includes(val) && val.length >= 2) return true;
  if(a.length <= 8 && val.includes(a)) return true;
  // Numeric fallback: pull the numbers out of both strings and check the answer's
  // numbers all appear in the typed answer, in the same order — so labels, units,
  // extra words, or a stray leading zero (e.g. "00.15" vs "0.15") don't cause a
  // false "wrong", while a genuinely reordered or incomplete answer still fails.
  const answerNums = extractNumbers(answer);
  if(answerNums.length > 0){
    const inputNums = extractNumbers(val);
    if(inputNums.length > 0 && numbersMatchInOrder(inputNums, answerNums)) return true;
  }
  return false;
}

function fuzzyMatch(val, answer){
  // answer may be a single string, or an array of equally-acceptable phrasings
  // (e.g. ["square","b","square b"]) — any one matching counts as correct.
  const candidates = Array.isArray(answer) ? answer : [answer];
  return candidates.some(cand => fuzzyMatchOne(val, cand));
}

function showFeedback(qid, correct, explain){
  const fb = document.getElementById(`fb-${qid}`);
  fb.classList.add('show', correct?'ok':'no');
  fb.innerHTML = `<b>${correct ? 'Correct! 🎉' : "Not quite — here's the idea:"}</b>${explain}`;
}

function updateScoreBar(chapterId){
  const sc = state.scores[chapterId];
  const bar = document.querySelector('.score-bar');
  if(!bar) return;
  const pct = sc.attempted ? Math.round(sc.correct/sc.attempted*100) : 0;
  bar.querySelector('.num').textContent = `${sc.correct}/${sc.attempted} correct`;
  bar.querySelector('.fill').style.width = pct + '%';
}

function renderReferenceSectionHTML(scope, label){
  return `
    <div class="setup-card">
      <h3>Reference Library${label ? ' — '+label : ''}</h3>
      <p>Upload photos or PDFs of past question papers, or the exercise pages from this chapter in her textbook. These are saved right here in this browser for your own reference.</p>
      <div class="ref-upload-area">
        <input type="file" id="refFileInput" accept="image/*,application/pdf" multiple style="display:none;">
        <button class="btn" id="refUploadBtn">+ Upload Files</button>
        <input type="text" id="refLabelInput" placeholder="Optional label, e.g. 'PT-2 2026 paper'" class="ref-label-input">
      </div>
      <div class="ref-note">To actually use these references to improve chapter content or the mock test generator, please also share them with me directly in our chat — I'll review them and update the tool. This library is just for your own organised storage, saved locally on this device.</div>
      <div class="ref-grid" id="refGrid"><p class="ref-loading">Loading saved references…</p></div>
    </div>
    <div id="refLightbox" class="ref-lightbox" style="display:none;"></div>
  `;
}

function wireReferenceSection(scope){
  const fileInput = document.getElementById('refFileInput');
  const uploadBtn = document.getElementById('refUploadBtn');
  const labelInput = document.getElementById('refLabelInput');
  if(!fileInput || !uploadBtn) return;

  uploadBtn.addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', async ()=>{
    const files = Array.from(fileInput.files);
    for(const file of files){
      try{
        const dataURL = await fileToDataURL(file);
        const record = {
          scope,
          fileName: file.name,
          fileType: file.type.startsWith('image/') ? 'image' : 'pdf',
          dataURL,
          label: labelInput.value.trim(),
          uploadedAt: Date.now()
        };
        await addReference(record);
      } catch(e){ console.error('Upload failed', e); }
    }
    labelInput.value = '';
    fileInput.value = '';
    loadReferenceGrid(scope);
  });

  loadReferenceGrid(scope);
}

function loadReferenceGrid(scope){
  getReferencesByScope(scope).then(refs=>{
    const gridEl = document.getElementById('refGrid');
    if(!gridEl) return;
    if(!refs.length){
      gridEl.innerHTML = `<p class="ref-empty">No references saved yet.</p>`;
      return;
    }
    refs.sort((a,b)=>b.uploadedAt-a.uploadedAt);
    gridEl.innerHTML = refs.map(r=>`
      <div class="ref-card" data-id="${r.id}">
        ${r.fileType==='image'
          ? `<img class="ref-thumb" src="${r.dataURL}" data-view="${r.id}">`
          : `<div class="ref-pdf-icon" data-view="${r.id}">\uD83D\uDCC4</div>`}
        <div class="ref-meta">
          <div class="ref-filename">${r.label || r.fileName}</div>
          <div class="ref-date">${new Date(r.uploadedAt).toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'})}</div>
        </div>
        <span class="ref-delete" data-del="${r.id}">Delete</span>
      </div>
    `).join('');

    gridEl.querySelectorAll('[data-view]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = parseInt(el.dataset.view);
        const ref = refs.find(x=>x.id===id);
        if(ref) openRefLightbox(ref);
      });
    });
    gridEl.querySelectorAll('[data-del]').forEach(el=>{
      el.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        const id = parseInt(el.dataset.del);
        if(confirm('Delete this reference?')){
          deleteReference(id).then(()=>loadReferenceGrid(scope));
        }
      });
    });
  }).catch(e=>{
    const gridEl = document.getElementById('refGrid');
    if(gridEl) gridEl.innerHTML = `<p class="ref-empty">Couldn't load references (${(e&&e.message)||'storage unavailable in this browser'}).</p>`;
  });
}

function openRefLightbox(ref){
  const box = document.getElementById('refLightbox');
  if(!box) return;
  if(ref.fileType === 'image'){
    box.innerHTML = `<div class="ref-lightbox-inner"><span class="ref-lightbox-close" id="refLbClose">&times;</span><img src="${ref.dataURL}"><div class="ref-lightbox-caption">${ref.label || ref.fileName}</div></div>`;
    box.style.display = 'flex';
    document.getElementById('refLbClose').addEventListener('click', ()=>{ box.style.display='none'; box.innerHTML=''; });
    box.addEventListener('click', (e)=>{ if(e.target===box){ box.style.display='none'; box.innerHTML=''; } });
  } else {
    const url = dataURLToBlobURL(ref.dataURL);
    window.open(url, '_blank');
  }
}

function renderTestRecordsPage(){
  const content = document.getElementById('content');
  const records = getTestRecords().slice().sort((a,b)=> new Date(a.date) - new Date(b.date));

  if(!records.length){
    content.innerHTML = `<div class="placeholder"><b>No test results logged yet</b>Once you generate a mock test on the "Build a mock test" page and she takes it, use "Log Result After Grading" there to start building her performance history here.</div>`;
    return;
  }

  const chartBars = records.map(r=>({
    label: new Date(r.date).toLocaleDateString('en-IN',{day:'numeric',month:'short'}),
    value: Math.round(r.scoredMarks/r.maxMarks*100)
  }));

  const chapterStats = {};
  records.forEach(r=>{
    const pct = r.scoredMarks/r.maxMarks*100;
    (r.chapterIds||[]).forEach(cid=>{
      if(!chapterStats[cid]) chapterStats[cid] = {sum:0,count:0};
      chapterStats[cid].sum += pct;
      chapterStats[cid].count += 1;
    });
  });
  const chapterRows = Object.keys(chapterStats).map(cid=>{
    const chapter = chapters.find(c=>c.id===cid);
    const avg = chapterStats[cid].sum / chapterStats[cid].count;
    return {name: chapter ? chapter.title.replace(/^\d+\.\s/,'') : cid, avg, count: chapterStats[cid].count};
  }).sort((a,b)=>a.avg-b.avg);

  const tableRows = records.slice().reverse().map(r=>{
    const pct = Math.round(r.scoredMarks/r.maxMarks*100);
    return `<tr>
        <td>${new Date(r.date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}</td>
        <td>${r.chapterNames}</td>
        <td>${r.scoredMarks} / ${r.maxMarks} (${pct}%)</td>
        <td>${r.notes || '\u2014'}</td>
        <td><span class="tr-delete" data-recid="${r.id}">Delete</span></td>
      </tr>`;
  }).join('');

  content.innerHTML = `
    <div class="setup-card">
      <h3>Score trend</h3>
      <p>Percentage scored on each logged test, in order.</p>
      ${barChart(chartBars, chartBars.length)}
    </div>
    <div class="setup-card">
      <h3>Chapter-wise performance</h3>
      <p>Average percentage across all logged tests that included each chapter — weakest first, so you can see where to focus.</p>
      <div class="tr-chapter-list">
        ${chapterRows.map(cr=>`
          <div class="tr-chapter-row">
            <span class="tr-chapter-name">${cr.name}</span>
            <div class="tr-chapter-bar-track"><div class="tr-chapter-bar-fill" style="width:${cr.avg}%; background:${cr.avg<50?'var(--error)':cr.avg<75?'var(--marigold)':'var(--success)'}"></div></div>
            <span class="tr-chapter-pct">${Math.round(cr.avg)}% <span class="tr-chapter-n">(${cr.count} test${cr.count>1?'s':''})</span></span>
          </div>
        `).join('')}
      </div>
    </div>
    <div class="setup-card">
      <h3>All logged tests</h3>
      <table class="tr-table">
        <thead><tr><th>Date</th><th>Chapters</th><th>Score</th><th>Notes</th><th></th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>
  `;

  content.querySelectorAll('.tr-delete').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(confirm('Delete this test record?')){
        deleteTestRecord(parseInt(el.dataset.recid));
        renderTestRecordsPage();
      }
    });
  });
}
